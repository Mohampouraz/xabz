name: downloader

on:
  issues:
    types: [opened]

jobs:
  get-file:
    if: startsWith(github.event.issue.title, 'DOWNLOAD:')
    runs-on: ubuntu-latest
    steps:
      # بیرون کشیدن URL از عنوان ایشو
      - name: Extract URL
        id: extract_url
        run: |
          TITLE="${{ github.event.issue.title }}"
          URL=${TITLE#DOWNLOAD:}
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "filename=$(basename "$URL")" >> $GITHUB_OUTPUT

      # دانلود هوشمندانه با curl که شبیه مرورگر رفتار می‌کنه
      - name: Download File
        run: |
          curl -L -H "User-Agent: Mozilla/5.0" -o "${{ steps.extract_url.outputs.filename }}" "${{ steps.extract_url.outputs.url }}"

      # آپلود مستقیم خودمون (دیگه به Action دیگه ای وابسته نیستیم)
      - name: Upload to this repo
        run: |
          mkdir -p output
          cp "${{ steps.extract_url.outputs.filename }}" output/
          
      - uses: actions/upload-artifact@v4
        with:
          name: my-download
          path: output/
